<div class="col">
  <div class="tarjeta p-3 h-100 position-relative bg-white">
    <div class="d-flex justify-content-between align-items-start gap-2 mb-1">
      <h3 class="h6 mb-0">{{ votacion.titulo }}</h3>
      {% include "votaciones/_estado.html" %}
    </div>
    <p class="small text-muted mb-1">{{ votacion.categoria.nombre }} · {{ votacion.categoria.edicion.anio }}</p>
    <p class="small mb-0">Abre {{ votacion.fecha_apertura|date:"d M Y, h:i a" }} · Cierra {{ votacion.fecha_cierre|date:"d M Y, h:i a" }}</p>
    <a class="stretched-link" href="{{ votacion.get_absolute_url }}" aria-label="Ver {{ votacion.titulo }}"></a>
  </div>
</div>
